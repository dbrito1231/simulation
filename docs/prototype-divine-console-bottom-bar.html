<title>Divine Console — Bottom Bar Prototype</title>
<style>
  :root {
    --ground:   #121218;
    --ground2:  #0c0c11;
    --panel:    #1b1b25;
    --panel2:   #23232e;
    --edge:     #34343f;
    --edge-soft:#282831;
    --gold:     #ffd27a;
    --gold-dim: #b5883a;
    --gold-deep:#4a3a1a;
    --text:     #dcdce4;
    --muted:    #9a9aa8;
    --faint:    #6f6f7c;
    --irr-bg:#4a1e1e; --irr-fg:#ffb3b3; --irr-edge:#a24545;
    --con-bg:#4a3a12; --con-fg:#ffdca0; --con-edge:#b5883a;
    --can-bg:#1e3a2a; --can-fg:#b3ffcf; --can-edge:#3a8a5a;
    --ok:#a5d6a7; --err:#ef9a9a;
    --ui: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .stage {
    position: relative;
    min-height: 100vh;
    background:
      radial-gradient(1200px 700px at 30% -10%, #1a1a2b 0%, transparent 60%),
      radial-gradient(900px 600px at 90% 110%, #241a2b 0%, transparent 55%),
      var(--ground2);
    color: var(--text);
    font-family: var(--ui);
    overflow: hidden;
    padding-bottom: 92px;
  }

  /* ---- mock world backdrop (stands in for the running sim) ---- */
  .world-note {
    position: absolute; top: 14px; left: 16px; z-index: 2;
    font: 600 12px var(--ui); color: var(--muted); letter-spacing: .04em;
    display: flex; align-items: center; gap: 8px;
  }
  .world-note .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px var(--gold); }
  .clock {
    position: absolute; top: 14px; right: 16px; z-index: 2;
    font: 600 12px var(--mono); color: var(--faint);
    border: 1px solid var(--edge-soft); border-radius: 5px; padding: 5px 10px;
    background: rgba(0,0,0,.35);
  }
  canvas#village { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; opacity: .9; }
  .caption {
    position: absolute; left: 50%; top: 20px; transform: translateX(-50%);
    z-index: 2; text-align: center; max-width: 560px;
  }
  .caption h1 { margin: 0 0 4px; font-size: 15px; font-weight: 700; letter-spacing: .02em; color: var(--gold); }
  .caption p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; }

  /* ---------------- bottom bar ---------------- */
  .divine-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; align-items: stretch; gap: 6px;
    padding: 10px 14px;
    background: linear-gradient(180deg, rgba(18,18,24,.55), rgba(10,10,14,.96));
    border-top: 1px solid var(--edge);
    backdrop-filter: blur(8px);
  }
  .divine-bar .bar-brand {
    display: flex; flex-direction: column; justify-content: center;
    padding-right: 12px; margin-right: 4px; border-right: 1px solid var(--edge-soft);
    min-width: 96px;
  }
  .bar-brand .b1 { font: 700 12px var(--ui); color: var(--gold); letter-spacing: .06em; text-transform: uppercase; }
  .bar-brand .b2 { font: 600 10px var(--mono); color: var(--faint); margin-top: 2px; }
  .bar-buttons { display: flex; gap: 6px; flex: 1 1 auto; flex-wrap: wrap; }

  .gbtn {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    min-width: 74px; padding: 8px 10px 6px;
    background: var(--panel); color: var(--muted);
    border: 1px solid var(--edge-soft); border-radius: 7px;
    cursor: pointer; font: 600 11px var(--ui);
    transition: background .12s, color .12s, border-color .12s, transform .08s;
  }
  .gbtn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; }
  .gbtn:hover:not(:disabled) { background: var(--panel2); color: var(--text); border-color: var(--gold-dim); transform: translateY(-1px); }
  .gbtn.active { background: var(--gold-deep); color: var(--gold); border-color: var(--gold-dim); }
  .gbtn.locked-dependent:disabled { opacity: .4; cursor: not-allowed; }
  .gbtn.compile { border-style: dashed; }
  .gbtn .lockpip {
    position: absolute; margin-top: -14px; margin-left: 44px;
    font-size: 9px; color: var(--err);
  }
  .gbtn.unlock.is-open-status .statuspip { color: var(--ok); }
  .statuspip { font: 700 8px var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--err); }
  .gbtn.unlock[data-state="unlocked"] .statuspip { color: var(--ok); }

  /* ---------------- modal ---------------- */
  .modal-scrim {
    position: fixed; inset: 0; z-index: 30;
    background: rgba(6,6,10,.66); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; padding: 24px;
  }
  .modal-scrim.open { display: flex; }
  .modal {
    width: min(680px, 96vw); max-height: 82vh; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 12px;
    box-shadow: 0 24px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,210,122,.06);
    animation: pop .16s ease-out;
  }
  @keyframes pop { from { transform: translateY(10px) scale(.985); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .modal { animation: none; } }
  .modal-head {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 18px; border-bottom: 1px solid var(--edge-soft);
  }
  .modal-head .mh-icon {
    width: 34px; height: 34px; display: grid; place-items: center;
    border-radius: 8px; background: var(--gold-deep); color: var(--gold);
    border: 1px solid var(--gold-dim); flex: none;
  }
  .modal-head .mh-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; }
  .modal-head h2 { margin: 0; font-size: 16px; font-weight: 700; color: var(--gold); }
  .modal-head p { margin: 2px 0 0; font-size: 11.5px; color: var(--muted); }
  .modal-head .spacer { flex: 1 1 auto; }
  .modal-close {
    width: 30px; height: 30px; border-radius: 7px; flex: none;
    background: transparent; border: 1px solid var(--edge-soft); color: var(--muted);
    cursor: pointer; font-size: 16px; line-height: 1;
  }
  .modal-close:hover { color: var(--text); border-color: var(--gold-dim); background: var(--panel2); }
  .modal-body { padding: 16px 18px; overflow-y: auto; }

  /* ---- form primitives (mirrors the app's divine-* classes) ---- */
  .fs { border: 1px solid var(--edge-soft); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .fs > legend { font: 700 11px var(--ui); color: var(--gold); padding: 0 6px; letter-spacing: .03em; }
  .fs-head { display: flex; align-items: center; gap: 8px; margin: -2px 0 8px; }
  .fs-head .fs-title { font: 700 12.5px var(--ui); color: var(--text); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .field { display: flex; flex-direction: column; gap: 3px; flex: 1 1 140px; }
  .field > span { font: 600 10.5px var(--ui); color: var(--muted); display: flex; align-items: center; gap: 4px; }
  input[type=text], input[type=password], input[type=number], select, textarea {
    background: var(--ground2); color: var(--text); border: 1px solid var(--edge);
    border-radius: 6px; padding: 6px 8px; font: 12px var(--ui); width: 100%;
  }
  textarea { min-height: 54px; resize: vertical; font-family: var(--mono); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--gold-dim); outline-offset: 0; border-color: var(--gold-dim); }
  .actions { display: flex; gap: 8px; margin-top: 6px; align-items: center; }
  .btn {
    padding: 7px 14px; font: 600 12px var(--ui); border-radius: 6px; cursor: pointer;
    background: var(--panel2); color: var(--text); border: 1px solid var(--edge);
  }
  .btn:hover:not(:disabled) { background: #30303c; border-color: var(--gold-dim); }
  .btn.primary { background: var(--gold-deep); color: var(--gold); border-color: var(--gold-dim); }
  .btn.primary:hover:not(:disabled) { background: #5a4620; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font: 700 9.5px var(--ui); letter-spacing: .04em; }
  .badge.irr { background: var(--irr-bg); color: var(--irr-fg); border: 1px solid var(--irr-edge); }
  .badge.con { background: var(--con-bg); color: var(--con-fg); border: 1px solid var(--con-edge); }
  .badge.can { background: var(--can-bg); color: var(--can-fg); border: 1px solid var(--can-edge); }
  .hint { font-size: 11px; color: var(--faint); margin: 0 0 10px; line-height: 1.5; }

  /* the little "?" tip trigger */
  .tip {
    display: inline-grid; place-items: center; width: 14px; height: 14px; flex: none;
    border-radius: 50%; border: 1px solid var(--gold-dim); color: var(--gold);
    font: 700 9px var(--mono); cursor: help; background: rgba(255,210,122,.06);
  }
  /* whole-section hover target */
  [data-tip] { position: relative; }

  /* floating tooltip */
  #tooltip {
    position: fixed; z-index: 60; max-width: 260px; pointer-events: none;
    background: #0a0a0e; color: var(--text); border: 1px solid var(--gold-dim);
    border-radius: 7px; padding: 8px 10px; font: 500 11.5px/1.5 var(--ui);
    box-shadow: 0 10px 30px rgba(0,0,0,.55);
    opacity: 0; transform: translateY(3px); transition: opacity .12s, transform .12s;
  }
  #tooltip.show { opacity: 1; transform: none; }
  #tooltip .t-title { font-weight: 700; color: var(--gold); margin-bottom: 2px; display: block; }

  .sight-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sight-cell { border: 1px solid var(--edge-soft); border-radius: 7px; padding: 9px; }
  .sight-cell .k { font: 700 9.5px var(--ui); text-transform: uppercase; letter-spacing: .05em; color: var(--faint); }
  .sight-cell .v { font: 600 13px var(--mono); color: var(--text); margin-top: 3px; }
  .meter { height: 6px; border-radius: 3px; background: var(--ground2); margin-top: 6px; overflow: hidden; }
  .meter > i { display: block; height: 100%; border-radius: 3px; }
  .hist-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--edge-soft); font-size: 12px; }
  .hist-item:last-child { border-bottom: 0; }
  .hbadge { font: 700 8.5px var(--ui); padding: 1px 5px; border-radius: 3px; letter-spacing: .04em; }
  .hbadge.pub { background: var(--can-bg); color: var(--can-fg); }
  .hbadge.prv { background: #3a1e3a; color: #e0b3ff; }
  .frames { color: var(--faint); font-family: var(--mono); font-size: 11px; }

  .toast {
    position: fixed; left: 50%; bottom: 104px; transform: translateX(-50%) translateY(8px);
    z-index: 50; background: #0a0a0e; border: 1px solid var(--gold-dim); color: var(--gold);
    padding: 8px 16px; border-radius: 8px; font: 600 12px var(--ui);
    opacity: 0; transition: opacity .18s, transform .18s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  @media (max-width: 620px) {
    .bar-brand { display: none; }
    .gbtn { min-width: 0; flex: 1 1 auto; }
    .gbtn span.lbl { display: none; }
  }
</style>

<div class="stage" id="stage">
  <canvas id="village"></canvas>
  <div class="world-note"><span class="dot"></span> AI Simulation World · feature/god-mode</div>
  <div class="clock">Day 41 · 06:14 · frame 123&nbsp;004</div>
  <div class="caption">
    <h1>Prototype — the Divine Console as a bottom bar</h1>
    <p>Click any glyph below. Each opens a large window; hover the <span class="tip" style="cursor:help">?</span> markers (or any control) for what it does. Start with <strong>Unlock</strong>.</p>
  </div>

  <!-- ================= BOTTOM BAR ================= -->
  <div class="divine-bar" id="divineBar">
    <div class="bar-brand">
      <span class="b1">Divine</span>
      <span class="b2" id="brandState">locked</span>
    </div>
    <div class="bar-buttons" id="barButtons"><!-- injected --></div>
  </div>

  <!-- ================= MODAL ================= -->
  <div class="modal-scrim" id="scrim">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <div class="modal-head">
        <div class="mh-icon" id="mIcon"></div>
        <div>
          <h2 id="mTitle">—</h2>
          <p id="mSub">—</p>
        </div>
        <div class="spacer"></div>
        <button class="modal-close" id="mClose" aria-label="Close">✕</button>
      </div>
      <div class="modal-body" id="mBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<div id="tooltip"></div>

<script>
(function () {
  "use strict";

  // --- tiny inline icon set (stroke glyphs, not emoji) ---
  const I = {
    unlock:  '<svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 7.5-2"/></svg>',
    sight:   '<svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.5"/></svg>',
    voice:   '<svg viewBox="0 0 24 24"><path d="M4 8h9l5-3v14l-5-3H4z"/><path d="M20 9a4 4 0 0 1 0 6"/></svg>',
    miracles:'<svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.4L18 9l-4.2 1.6L12 15l-1.8-4.4L6 9l4.2-1.6z"/><path d="M18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9z"/></svg>',
    story:   '<svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h6v18H6a2 2 0 0 1-2-2z"/><path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/></svg>',
    laws:    '<svg viewBox="0 0 24 24"><path d="M12 3v18M5 7h14M7 7l-3 6h6zM17 7l3 6h-6z"/></svg>',
    history: '<svg viewBox="0 0 24 24"><path d="M3 5h14v14H3z"/><path d="M7 9h6M7 13h6M7 5v14"/></svg>',
    compile: '<svg viewBox="0 0 24 24"><path d="M6 20l9-14M15 6l3 1-1 3M9 20l-3-1 1-3"/></svg>',
  };

  const FEATURES = [
    { id:"unlock",  label:"Unlock",   title:"Unlock the Divine Console",
      sub:"Authenticate with the God token to enable every other tool.",
      gated:false },
    { id:"sight",   label:"Sight",    title:"Sight — private inspection",
      sub:"See what agents never expose publicly: vitals, ties, omens, active effects.",
      gated:true },
    { id:"voice",   label:"Voice",    title:"Voice — proclamations & omens",
      sub:"Speak to the village, or whisper a private omen to one agent.",
      gated:true },
    { id:"miracles",label:"Miracles", title:"Miracles — direct intervention",
      sub:"Heal, grant resources, or repair/damage a structure. Irreversible once applied.",
      gated:true },
    { id:"story",   label:"Story",    title:"Story — timed narrative events",
      sub:"Compose a titled event from validated effect primitives.",
      gated:true },
    { id:"laws",    label:"Laws",     title:"Laws — temporary world modifiers",
      sub:"Bend gather yield, hunger, spoilage and more for a bounded time.",
      gated:true },
    { id:"history", label:"History",  title:"History — intervention log",
      sub:"Every applied intervention, public and private, most recent first.",
      gated:true },
    { id:"compile", label:"Compile",  title:"Compile — prose to event (disabled)",
      sub:"Turn narrative prose into a typed draft. Dark until contention is measured.",
      gated:true, disabled:true },
  ];

  let unlocked = false;

  // ---------- build the bar ----------
  const barButtons = document.getElementById("barButtons");
  FEATURES.forEach(f => {
    const b = document.createElement("button");
    b.className = "gbtn " + f.id + (f.gated ? " locked-dependent" : "") + (f.id==="compile" ? " compile" : "");
    b.dataset.feature = f.id;
    b.type = "button";
    if (f.disabled) b.disabled = true;
    b.innerHTML = I[f.id] + '<span class="lbl">' + f.label + '</span>' +
      (f.id === "unlock" ? '<span class="statuspip" id="unlockPip">locked</span>' : '');
    if (f.gated && !f.disabled) b.disabled = true; // gated until unlock
    b.addEventListener("click", () => openFeature(f.id));
    b.setAttribute("data-tip", JSON.stringify({ t:f.title, d:f.sub }));
    barButtons.appendChild(b);
  });
  const unlockBtn = barButtons.querySelector(".gbtn.unlock");
  unlockBtn.disabled = false; // unlock is always available

  function setGate(on) {
    unlocked = on;
    document.getElementById("brandState").textContent = on ? "authorized" : "locked";
    document.getElementById("brandState").style.color = on ? "var(--ok)" : "var(--faint)";
    const pip = document.getElementById("unlockPip");
    pip.textContent = on ? "ready" : "locked";
    unlockBtn.dataset.state = on ? "unlocked" : "locked";
    FEATURES.forEach(f => {
      if (!f.gated || f.disabled) return;
      barButtons.querySelector(".gbtn." + f.id).disabled = !on;
    });
  }

  // ---------- modal ----------
  const scrim = document.getElementById("scrim");
  const mIcon = document.getElementById("mIcon");
  const mTitle = document.getElementById("mTitle");
  const mSub = document.getElementById("mSub");
  const mBody = document.getElementById("mBody");

  function openFeature(id) {
    const f = FEATURES.find(x => x.id === id);
    if (!f) return;
    if (f.disabled) { toast("Compile is disabled — enable SIM_GOD_COMPILER after the contention check"); return; }
    if (f.gated && !unlocked) { toast("Unlock first — enter the God token"); return; }
    barButtons.querySelectorAll(".gbtn").forEach(b => b.classList.toggle("active", b.dataset.feature === id));
    mIcon.innerHTML = I[id];
    mTitle.textContent = f.title;
    mSub.textContent = f.sub;
    mBody.innerHTML = BODIES[id]();
    scrim.classList.add("open");
    wireBodyTips();
    if (id === "unlock") wireUnlock();
    if (id !== "unlock") wireDemoPreview();
  }
  function closeModal() {
    scrim.classList.remove("open");
    barButtons.querySelectorAll(".gbtn").forEach(b => b.classList.remove("active"));
    hideTip();
  }
  document.getElementById("mClose").addEventListener("click", closeModal);
  scrim.addEventListener("click", e => { if (e.target === scrim) closeModal(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

  // ---------- modal bodies (representative content + tips) ----------
  const tipAttr = (t, d) => 'data-tip=\'' + JSON.stringify({t:t, d:d}).replace(/'/g,"&#39;") + '\'';
  const q = (t, d) => '<span class="tip" ' + tipAttr(t,d) + '>?</span>';

  const BODIES = {
    unlock: () => `
      <p class="hint">The token lives only in this browser tab's memory. It is never written to disk, logs, or the world state. Any auth failure re-locks the console.</p>
      <fieldset class="fs">
        <div class="fs-head"><span class="fs-title">God token</span>
          ${q("God token","The value of SIM_GOD_TOKEN set at server startup. Sent as the X-God-Token header on every request.")}</div>
        <div class="row">
          <label class="field"><span>Token</span><input type="password" id="tokInput" placeholder="paste SIM_GOD_TOKEN" value="aEERqusB5dWCDJ8gLpxM-p_C5aWtO7PY"></label>
        </div>
        <div class="row">
          <label class="field" style="flex-direction:row;align-items:center;gap:6px" ${tipAttr("Remember for this tab","Stores the token in sessionStorage — cleared when the tab closes. localStorage is never used.")}>
            <input type="checkbox" style="width:auto"> <span style="margin:0">Remember for this tab</span>
          </label>
        </div>
        <div class="actions"><button class="btn primary" id="connectBtn">Connect</button>
          <span id="unlockStatus" style="font:600 11px var(--ui);color:var(--err)">Locked</span></div>
      </fieldset>`,

    sight: () => `
      <p class="hint">Read-only. Nothing here mutates the world. Values that never appear in public <code>/state</code> are visible only through this authenticated view.</p>
      <div class="row"><label class="field"><span>Agent ${q("Agent selector","Pick any living agent. The panel refreshes from /control/god/sight for that agent id.")}</span>
        <select><option>Sage (elder)</option><option>Ash</option><option>Ivy</option><option>Rex</option></select></label></div>
      <div class="sight-grid">
        <div class="sight-cell" ${tipAttr("Health","Current health 0–100. Divine vitals miracles clamp within this range and cannot kill.")}>
          <div class="k">Health</div><div class="v">82</div><div class="meter"><i style="width:82%;background:var(--ok)"></i></div></div>
        <div class="sight-cell" ${tipAttr("Hunger","Current hunger 0–100. Drops over time; feeding restores it.")}>
          <div class="k">Hunger</div><div class="v">54</div><div class="meter"><i style="width:54%;background:var(--con-fg)"></i></div></div>
        <div class="sight-cell" ${tipAttr("Active omen","Whether this agent currently carries a private divine omen, and how many frames remain.")}>
          <div class="k">Private omen</div><div class="v" style="color:var(--gold)">yes · 1 240f</div></div>
        <div class="sight-cell" ${tipAttr("Resources","What the agent is carrying right now.")}>
          <div class="k">Carrying</div><div class="v">wood 3 · fish 1</div></div>
      </div>`,

    voice: () => `
      <p class="hint">Speak publicly, or guide privately. Guidance is non-binding — agents may interpret or ignore it. <span class="badge can">CANCELLABLE</span></p>
      <fieldset class="fs">
        <div class="fs-head"><span class="fs-title">Proclamation</span>
          ${q("Proclamation","A one-off public announcement. Writes to activity + the Chronicle as a divine event. No lasting cognition effect.")}</div>
        <div class="row"><label class="field"><span>Message</span><textarea>The long night ends; tend your stores.</textarea></label></div>
        <div class="actions"><button class="btn demo-prev">Preview</button><button class="btn primary demo-apply" disabled>Apply</button></div>
      </fieldset>
      <fieldset class="fs">
        <div class="fs-head"><span class="fs-title">Private omen</span>
          ${q("Private omen","A guidance line seen ONLY by one agent, and never in public /state. On expiry it enters that agent's memory exactly once.")}</div>
        <div class="row">
          <label class="field"><span>To agent ${q("Target","One living agent. Keyed by stable id, so a rename never misroutes it.")}</span><select><option>Ash</option><option>Ivy</option></select></label>
          <label class="field" style="flex:0 0 120px"><span>Duration (frames) ${q("Duration","How long the omen stays active, in 30-frames-per-second sim time.")}</span><input type="number" value="1800"></label>
        </div>
        <div class="row"><label class="field"><span>Omen</span><textarea>Seek reconciliation with Rex.</textarea></label></div>
        <div class="actions"><button class="btn demo-prev">Preview</button><button class="btn primary demo-apply" disabled>Apply</button></div>
      </fieldset>`,

    miracles: () => `
      <p class="hint"><span class="badge irr">IRREVERSIBLE</span> Once applied these cannot be undone — an inverse is a new intervention, not a rollback. Preview shows the exact clamped value first.</p>
      <fieldset class="fs">
        <div class="fs-head"><span class="fs-title">Agent vitals</span>
          ${q("Agent vitals","Add health and/or hunger to one living agent, clamped 0–100. A negative delta cannot drive an agent to death in v1.")}</div>
        <div class="row">
          <label class="field"><span>Agent</span><select><option>Rex</option><option>Ash</option></select></label>
          <label class="field" style="flex:0 0 110px"><span>Δ Health ${q("Health delta","Signed change applied to health, then clamped. Preview reveals the resulting value.")}</span><input type="number" value="25"></label>
          <label class="field" style="flex:0 0 110px"><span>Δ Hunger</span><input type="number" value="0"></label>
        </div>
        <div class="actions"><button class="btn demo-prev">Preview</button><button class="btn primary demo-apply" disabled>Apply</button></div>
      </fieldset>
      <fieldset class="fs">
        <div class="fs-head"><span class="fs-title">Grant resource</span>
          ${q("Grant resource","Add a known resource to the village stockpile or one agent. Capped per command and per session; respects carry limits.")}</div>
        <div class="row">
          <label class="field"><span>Resource</span><select><option>wood</option><option>fish</option><option>stone</option></select></label>
          <label class="field" style="flex:0 0 90px"><span>Amount</span><input type="number" value="20"></label>
          <label class="field"><span>To ${q("Target","Stockpile, or a single agent's inventory.")}</span><select><option>village stockpile</option><option>agent: Ivy</option></select></label>
        </div>
        <div class="actions"><button class="btn demo-prev">Preview</button><button class="btn primary demo-apply" disabled>Apply</button></div>
      </fieldset>`,

    story: () => `
      <p class="hint">A titled, timed event composed from validated primitives. Adding an immediate primitive makes it <span class="badge con">CONSEQUENTIAL</span> — cancelling stops the future, not what already happened.</p>
      <fieldset class="fs">
        <div class="fs-head"><span class="fs-title">The Black River</span>
          ${q("Story event","Bundles narration + timed modifiers + optional immediate effects under one id. Preview validates every part; Apply is all-or-nothing.")}</div>
        <div class="row">
          <label class="field"><span>Title</span><input type="text" value="The Black River"></label>
          <label class="field" style="flex:0 0 130px"><span>Duration (frames) ${q("Duration","Total lifetime of the event and its timed modifiers.")}</span><input type="number" value="2700"></label>
        </div>
        <div class="row"><label class="field"><span>Narration</span><textarea>The river darkens, and fish become scarce.</textarea></label></div>
        <div class="row"><label class="field"><span>Modifier ${q("Timed modifier","One of the seven world multipliers, active for the event's lifetime. Here: fish yield halved.")}</span>
          <select><option>fish_yield_multiplier → 0.5</option><option>gather_yield_multiplier → 1.5</option></select></label></div>
        <div class="actions"><button class="btn demo-prev">Preview</button><button class="btn primary demo-apply" disabled>Apply</button></div>
      </fieldset>`,

    laws: () => `
      <p class="hint"><span class="badge can">CANCELLABLE</span> One active value per key. Bounds come from <code>/control/god/capabilities</code>. Active laws show a countdown you can cancel.</p>
      <fieldset class="fs">
        <div class="fs-head"><span class="fs-title">Set a modifier</span>
          ${q("Timed law","Scales a live calculation for a bounded time. A value of 1.0 is a no-op, identical to the feature being off.")}</div>
        <div class="row">
          <label class="field"><span>Key</span><select>
            <option>gather_yield_multiplier · 0.25–3.0</option>
            <option>hunger_drain_multiplier · 0.0–3.0</option>
            <option>starvation_damage_multiplier · 0.0–3.0</option>
            <option>spoilage_multiplier · 0.0–3.0</option></select></label>
          <label class="field" style="flex:0 0 90px"><span>Value ${q("Value","Clamped to the key's range. Preview shows the divine and any village-rule contribution separately.")}</span><input type="number" value="2.0" step="0.1"></label>
          <label class="field" style="flex:0 0 120px"><span>Duration (frames)</span><input type="number" value="3600"></label>
        </div>
        <div class="actions"><button class="btn demo-prev">Preview</button><button class="btn primary demo-apply" disabled>Apply</button></div>
      </fieldset>
      <fieldset class="fs">
        <div class="fs-head"><span class="fs-title">Active laws</span>${q("Active laws","Currently running modifiers with remaining time. Cancel ends one early.")}</div>
        <div class="hist-item"><span style="flex:1">gather_yield_multiplier <strong style="color:var(--gold)">2.0</strong></span>
          <span class="frames">02:40 · 4 812f</span><button class="btn" style="padding:4px 10px">Cancel</button></div>
      </fieldset>`,

    history: () => `
      <p class="hint">Newest first. Public entries also appear in the world Chronicle; private omens are visible here only, never in public panels.</p>
      <div class="hist-item"><span class="hbadge pub">PUBLIC</span><span style="flex:1">Proclamation — "The long night ends"</span><span class="frames">divine-7 · 122 990f</span></div>
      <div class="hist-item"><span class="hbadge prv">PRIVATE</span><span style="flex:1">Omen → Ash — "Seek reconciliation"</span><span class="frames">divine-6 · 121 400f</span></div>
      <div class="hist-item"><span class="hbadge pub">PUBLIC</span><span style="flex:1">Story — The Black River (fish ×0.5)</span><span class="frames">divine-5 · 118 220f</span></div>
      <div class="hist-item"><span class="hbadge pub">PUBLIC</span><span style="flex:1">Miracle — Rex health +25</span><span class="frames">divine-4 · 117 015f</span></div>`,
    compile: () => ``,
  };

  // ---------- unlock behaviour ----------
  function wireUnlock() {
    const btn = document.getElementById("connectBtn");
    const status = document.getElementById("unlockStatus");
    btn.addEventListener("click", () => {
      const v = document.getElementById("tokInput").value.trim();
      if (!v) { status.textContent = "Enter a token"; status.style.color = "var(--err)"; return; }
      setGate(true);
      status.textContent = "Authorized ✓"; status.style.color = "var(--ok)";
      toast("Divine Console unlocked — all tools enabled");
      setTimeout(closeModal, 650);
    });
  }

  // ---------- demo preview→apply (shows the gate; no real calls) ----------
  function wireDemoPreview() {
    mBody.querySelectorAll(".fs").forEach(fs => {
      const prev = fs.querySelector(".demo-prev");
      const apply = fs.querySelector(".demo-apply");
      if (!prev || !apply) return;
      fs.querySelectorAll("input,select,textarea").forEach(el =>
        el.addEventListener("input", () => { apply.disabled = true; }));
      prev.addEventListener("click", () => {
        apply.disabled = false;
        toast("Preview OK — review, then Apply");
      });
      apply.addEventListener("click", () => {
        apply.disabled = true;
        toast("Applied — engine response rendered");
      });
    });
  }

  // ---------- tooltip engine ----------
  const tooltip = document.getElementById("tooltip");
  let tipHideT = null;
  function showTip(el) {
    let data = el.getAttribute("data-tip"); if (!data) return;
    try { data = JSON.parse(data.replace(/&#39;/g,"'")); } catch (e) { return; }
    tooltip.innerHTML = '<span class="t-title">' + esc(data.t) + '</span>' + esc(data.d);
    tooltip.classList.add("show");
    const r = el.getBoundingClientRect();
    const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
    let x = r.left + r.width/2 - tw/2;
    let y = r.top - th - 8;
    if (y < 8) y = r.bottom + 8;
    x = Math.max(8, Math.min(x, window.innerWidth - tw - 8));
    tooltip.style.left = x + "px"; tooltip.style.top = y + "px";
  }
  function hideTip() { tooltip.classList.remove("show"); }
  function wireBodyTips() {
    document.querySelectorAll("[data-tip]").forEach(el => {
      if (el._tipWired) return; el._tipWired = true;
      el.addEventListener("mouseenter", () => { clearTimeout(tipHideT); showTip(el); });
      el.addEventListener("mouseleave", () => { tipHideT = setTimeout(hideTip, 60); });
      el.addEventListener("focusin", () => showTip(el));
      el.addEventListener("focusout", hideTip);
    });
  }
  wireBodyTips(); // bar buttons

  // ---------- misc ----------
  const toastEl = document.getElementById("toast");
  let toastT = null;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove("show"), 1900);
  }
  function esc(s) { const d = document.createElement("div"); d.textContent = String(s); return d.innerHTML; }

  // ---------- mock village backdrop ----------
  const cv = document.getElementById("village"), ctx = cv.getContext("2d");
  function draw() {
    const w = cv.width = cv.clientWidth, h = cv.height = cv.clientHeight;
    ctx.clearRect(0,0,w,h);
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = "#20202c"; ctx.lineWidth = 1;
    for (let x=0;x<w;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
    for (let y=0;y<h;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
    ctx.globalAlpha = 1;
    const pts = [[.28,.42],[.34,.55],[.4,.4],[.62,.5],[.7,.62],[.66,.38],[.5,.66],[.55,.34],[.44,.72],[.74,.48]];
    pts.forEach((p,i) => {
      const x=p[0]*w, y=p[1]*h;
      ctx.beginPath(); ctx.arc(x,y,4,0,7);
      ctx.fillStyle = i%3===0 ? "#ffd27a" : "#7ba7d0"; ctx.fill();
      ctx.globalAlpha=.18; ctx.beginPath(); ctx.arc(x,y,12,0,7); ctx.fillStyle=ctx.fillStyle; ctx.fill(); ctx.globalAlpha=1;
    });
    // a couple of "structures"
    ctx.strokeStyle="#3a3a48"; ctx.fillStyle="#191922";
    [[.31,.46],[.6,.55],[.68,.42]].forEach(p=>{const x=p[0]*w,y=p[1]*h;ctx.fillRect(x-9,y-9,18,18);ctx.strokeRect(x-9,y-9,18,18);});
  }
  draw(); window.addEventListener("resize", draw);

  setGate(false);
})();
</script>
